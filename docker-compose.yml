services:
  agent:
    build: .
    image: xmpp-ai-agent:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - agent-data:/app/data
    # The agent is outbound-only; expose nothing by default.
    # Add a webhook port here when Phase 4 lands.

volumes:
  agent-data:
